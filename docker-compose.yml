services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3

  ingest:
    build:
      context: .
      args:
        SERVICE: ingest
    environment:
      - REDIS_URL=redis:6379
      - RECORDING_ID=${RECORDING_ID:-}
    depends_on:
      redis:
        condition: service_healthy

  wsserver1:
    build:
      context: .
      args:
        SERVICE: wsserver
    environment:
      - REDIS_URL=redis:6379
      - WS_ADDR=:8080
    depends_on:
      redis:
        condition: service_healthy

  wsserver2:
    build:
      context: .
      args:
        SERVICE: wsserver
    environment:
      - REDIS_URL=redis:6379
      - WS_ADDR=:8080
    depends_on:
      redis:
        condition: service_healthy

  wsserver3:
    build:
      context: .
      args:
        SERVICE: wsserver
    environment:
      - REDIS_URL=redis:6379
      - WS_ADDR=:8080
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wsserver1
      - wsserver2
      - wsserver3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
